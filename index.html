<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#062b46"><link rel="manifest" href="manifest.json"><title>Funcional Digital GCM Itapevi</title><style>body{margin:0;background:#061d2e;color:#fff;font-family:Arial,sans-serif}header{text-align:center;background:#062b46;padding:18px}header img{width:90px;height:90px;border-radius:50%;object-fit:cover;background:#fff}h1{font-size:21px;margin:8px}.sub{font-size:12px;opacity:.8}main{max-width:520px;margin:auto;padding:16px}.card{background:#f5f5f2;color:#092b42;border-radius:18px;padding:18px}button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:11px;background:#1288df;color:#fff;font-size:16px;font-weight:bold}button.secondary{background:#405c70}label{display:block;font-weight:bold;font-size:12px;margin-top:12px}input{width:100%;padding:12px;border-radius:9px;border:1px solid #aaa;font-size:16px;box-sizing:border-box}.photo{width:145px;height:170px;object-fit:cover;display:block;margin:10px auto;border-radius:10px}.data{padding:9px 0;border-top:1px solid #ccd4d8}.data b{display:block;font-size:11px;color:#587080}.screen{display:none}.screen.active{display:block}.small{text-align:center;font-size:12px;opacity:.75}</style></head><body><header><img src="brasao-gcm-itapevi.jpg"><h1>FUNCIONAL DIGITAL</h1><div class="sub">GUARDA CIVIL MUNICIPAL DE ITAPEVI</div></header><main><section id="home" class="screen active"><h2>Minha Funcional</h2><button onclick="show('card')">🪪 Visualizar Funcional</button><button onclick="show('edit')">✏️ Editar Dados</button><button onclick="show('qr')">▣ QR Code</button><p class="small">DISCIPLINA • PROTEÇÃO • SERVIÇO À SOCIEDADE</p></section><section id="card" class="screen"><div class="card"><img src="brasao-gcm-itapevi.jpg" style="width:100%;max-height:170px;object-fit:contain"><h2 style="text-align:center">GUARDA CIVIL MUNICIPAL DE ITAPEVI</h2><img id="cardPhoto" class="photo"><div class="data"><b>NOME</b><span id="cNome"></span></div><div class="data"><b>MATRÍCULA</b><span id="cMat"></span></div><div class="data"><b>CARGO</b><span id="cCargo"></span></div><div class="data"><b>DATA DE ADMISSÃO</b><span id="cAdm"></span></div><div class="data"><b>LOTAÇÃO</b><span id="cLot"></span></div></div><button onclick="show('qr')">▣ Gerar QR Code</button><button class="secondary" onclick="show('home')">Voltar</button></section><section id="edit" class="screen"><h2>Editar Dados</h2><div class="card"><label>Foto</label><input id="foto" type="file" accept="image/*"><label>Nome</label><input id="nome"><label>Matrícula</label><input id="matricula"><label>Cargo</label><input id="cargo" value="Guarda Civil Municipal"><label>Data de admissão</label><input id="admissao" placeholder="DD/MM/AAAA"><label>Lotação</label><input id="lotacao"></div><button onclick="save()">💾 Salvar</button><button class="secondary" onclick="show('home')">Voltar</button></section><section id="qr" class="screen"><h2>QR Code de Validação</h2><div class="card"><img id="qrimg" style="display:block;margin:auto;width:240px;height:240px"><p class="small">QR Code gerado a partir dos dados cadastrados.</p></div><button class="secondary" onclick="show('home')">Voltar</button></section></main><script>let d=JSON.parse(localStorage.getItem('gcmItapevi')||'{}');const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');if(id==='card')render();if(id==='qr')makeQR()}function load(){nome.value=d.nome||'';matricula.value=d.matricula||'';cargo.value=d.cargo||'Guarda Civil Municipal';admissao.value=d.admissao||'';lotacao.value=d.lotacao||''}function save(){d={nome:nome.value,matricula:matricula.value,cargo:cargo.value,admissao:admissao.value,lotacao:lotacao.value,foto:d.foto||''};let f=foto.files[0];if(f){let r=new FileReader();r.onload=()=>{d.foto=r.result;persist()};r.readAsDataURL(f)}else persist()}function persist(){localStorage.setItem('gcmItapevi',JSON.stringify(d));alert('Dados salvos.');show('card')}function render(){cNome.textContent=d.nome||'Não informado';cMat.textContent=d.matricula||'Não informado';cCargo.textContent=d.cargo||'Guarda Civil Municipal';cAdm.textContent=d.admissao||'Não informado';cLot.textContent=d.lotacao||'Não informado';cardPhoto.src=d.foto||'brasao-gcm-itapevi.jpg'}function makeQR(){let s=encodeURIComponent('GCM ITAPEVI | '+(d.nome||'Não informado')+' | Matrícula: '+(d.matricula||'Não informado'));qrimg.src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&data='+s}load();render();</script></body></html>
